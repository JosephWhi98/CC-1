<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CC-1">
<meta name="theme-color" content="#c9c6bf"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png">
<title>CC-1 · claude code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --key:#f3f1ec;--well:#cfccc4;--toolbg:#e5e9d6;--lcd-mute:#5d6650;--lcd-faint:#c0c8ae;--on-accent:#fff;--fs:13px;--bodyfont:'Space Mono',ui-monospace,Menlo,monospace;
  --bg:#c9c6bf; --body:#e9e7e1; --body-2:#dedbd3; --ink:#161616; --mute:#77746c;
  --orange:#ff4d00; --orange-d:#c93b00; --lcd:#d9dfc9; --lcd-ink:#1b2014; --lcd-dim:#9ba38a;
  --blue:#2f5bff; --yellow:#ffc400; --green:#2bd46a;
  --mono:'Space Mono',ui-monospace,Menlo,monospace; --sans:'Inter','Helvetica Neue',Arial,sans-serif;
  --shadow:0 1px 0 #fff inset,0 -2px 0 rgba(0,0,0,.12) inset,0 2px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(#0002 1px,transparent 1.2px);background-size:14px 14px;
  font-family:var(--mono);color:var(--ink);display:flex;padding:20px;overflow:hidden}
.device{flex:1;min-width:0;display:grid;grid-template-columns:230px 1fr 340px;grid-template-rows:auto 1fr auto;gap:14px;
  background:var(--body);border-radius:22px;padding:18px;position:relative;
  box-shadow:0 1px 0 #fff inset,0 30px 60px -20px #0006,0 0 0 2px #0002}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9b6ae);box-shadow:0 0 0 1px #0003}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:#0006;transform:rotate(35deg)}
.s1{top:8px;left:8px}.s2{top:8px;right:8px}.s3{bottom:8px;left:8px}.s4{bottom:8px;right:8px}

.label{font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.label b{color:var(--ink)}

/* header */
header{grid-column:1/-1;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.logo{flex:none;white-space:nowrap;font:800 26px var(--sans);letter-spacing:-.03em;display:flex;align-items:baseline;gap:8px}
.logo i{flex:none;font-style:normal;width:14px;height:14px;border-radius:50%;background:var(--orange);display:inline-block;transform:translateY(1px)}
.logo small{white-space:nowrap;font:700 10px var(--sans);letter-spacing:.14em;color:var(--mute)}
.spacer{flex:1;min-width:0;container-type:inline-size}.floppy{display:none}
.lcd-row{display:flex;gap:8px}
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:6px;padding:5px 10px;min-width:92px;
  box-shadow:0 2px 4px #0003 inset,0 1px 0 #fff;border:1px solid #0002}
.lcd .label{color:var(--lcd-mute);font-size:8px}
.lcd:not(#btnUsage){text-align:center;display:flex;flex-direction:column}
.lcd:not(#btnUsage) .v{flex:1;display:flex;align-items:center;justify-content:center}
.lcd .v{font:700 16px var(--mono);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.lcd .pl{display:flex;align-items:center;gap:6px;margin-top:2px}
.lcd .pl b{font:700 11px var(--mono);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.pbar{flex:1;min-width:44px;height:6px;background:#0002;border-radius:1px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--lcd-ink);transition:width .3s}
.pbar i.hot{background:var(--orange)}
.led{display:flex;align-items:center;gap:6px}
.led i{width:10px;height:10px;border-radius:50%;background:var(--well);box-shadow:0 1px 2px #0004 inset;transition:.15s}
.led{--lc:var(--orange)}.led.green{--lc:var(--green)}
.led.on i{background:var(--lc);box-shadow:0 0 10px var(--lc),0 0 0 2px color-mix(in srgb,var(--lc) 22%,transparent)}

/* panels */
aside{display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{background:var(--body-2);border-radius:14px;padding:12px;box-shadow:0 1px 0 #fff inset,0 0 0 1px #0001}
.panel > .label{display:flex;justify-content:space-between;margin-bottom:10px}

/* pads */
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pad{height:84px;min-height:84px;flex-shrink:0;border:0;border-radius:10px;background:var(--key);box-shadow:var(--shadow);cursor:pointer;
  font:700 10px var(--mono);color:var(--ink);text-align:left;padding:8px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;transition:transform .05s}
.pad:active{transform:translateY(2px);box-shadow:0 1px 0 #fff inset}
.pad .n{font:800 18px var(--sans);letter-spacing:-.04em;color:var(--mute)}
.pad .t{word-break:break-word;line-height:1.15;text-transform:lowercase}
.pad.on{background:var(--orange);color:var(--on-accent);box-shadow:0 -2px 0 rgba(0,0,0,.2) inset,0 0 0 2px #fff6 inset,0 2px 0 var(--orange-d)}
.pad.on .n{color:var(--on-accent);opacity:.7}
.projwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.projwrap .panel{flex:1 1 0;min-height:140px;display:flex;flex-direction:column;overflow:hidden}
.projwrap .panel:first-child{flex-grow:1.4}
.root{font-size:9px;color:var(--mute);margin-top:8px;word-break:break-all}

.pad .x{position:absolute;top:4px;right:6px;font:700 13px var(--sans);color:var(--mute);opacity:0;cursor:pointer;padding:0 3px}
.pad:hover .x{opacity:1}.pad.on .x{color:var(--on-accent)}
.pads{flex:1;min-height:0;align-content:start;grid-auto-rows:84px;overflow-y:auto;padding:4px 9px 14px;margin:-4px -9px 0}
.mini{border:0;border-radius:6px;background:var(--key);box-shadow:var(--shadow);font:800 9px var(--sans);letter-spacing:.12em;padding:4px 8px;cursor:pointer;color:var(--ink)}
.panel .label .acts{display:flex;gap:6px;white-space:nowrap}
.panel>.label>span:first-child{white-space:nowrap}
.panel>.label{flex-wrap:wrap;row-gap:6px}
.panel>.label .acts{margin-left:auto}
.left,.right{min-width:0}
.mini{white-space:nowrap}
.mini:active{transform:translateY(1px)}
.mini.o{background:var(--orange);color:var(--on-accent)}
.panel > .label .acts{display:flex;gap:6px;align-items:center}
#sess{display:flex;flex-direction:column;gap:5px;overflow-x:hidden;overflow-y:auto;flex:1;min-height:0;padding:4px 9px 14px;margin:-4px -9px 0}
.sess{border:0;text-align:left;cursor:pointer;background:var(--key);border-radius:7px;padding:6px 8px;box-shadow:0 1px 0 #fff inset,0 1px 2px #0002;font:11px/1.3 var(--mono);color:var(--ink)}
.sess .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .d{display:block;font-size:9px;color:var(--mute);margin-top:2px}
.sess.on{background:var(--ink);color:var(--body)}.sess.on .d{color:#aaa}
.sess.none{cursor:default;color:var(--mute);background:transparent;box-shadow:none}
/* screen */
main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--lcd);border-radius:14px;
  box-shadow:0 3px 8px #0003 inset,0 1px 0 #fff,0 0 0 1px #0002;color:var(--lcd-ink);position:relative}
.screenbar>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.screenbar #sbModel{flex:none}
.screenbar{display:flex;justify-content:space-between;gap:12px;min-width:0;overflow:hidden;white-space:nowrap;padding:8px 14px;border-bottom:1px dashed #0003;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--lcd-mute)}
#log>*{flex-shrink:0}
#log{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--lcd-dim)}
.empty .big{font:800 56px var(--sans);letter-spacing:-.05em;color:var(--lcd-faint)}
.msg{max-width:100%}
.who{font:700 9px var(--sans);letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.who::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lcd-ink)}
.msg.user .who::before{background:var(--orange)}
.msg.user .body{background:var(--key);border-radius:8px;padding:9px 12px;box-shadow:0 1px 0 #fff inset,0 1px 2px #0002;white-space:pre-wrap}
.body{font-size:var(--fs);font-family:var(--bodyfont);line-height:1.55;overflow-wrap:anywhere}
.body p{margin:0 0 .6em}.body p:last-child{margin:0}
.body code{background:#0001;padding:1px 5px;border-radius:3px;font-size:12px}
.body pre{background:#1a1d14;color:#d9e6b8;border-radius:8px;padding:10px 12px;overflow:auto;margin:.5em 0;font-size:12px;line-height:1.45}
.body pre code{background:none;padding:0;color:inherit}
.body h1,.body h2,.body h3{font:800 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;margin:.8em 0 .3em}
.body ul{padding-left:1.2em;margin:.3em 0}
.cursor::after{content:"█";animation:blink 1s steps(2) infinite;color:var(--orange)}
@keyframes blink{50%{opacity:0}}
.tool{border:1.5px solid var(--lcd-ink);border-radius:8px;font-size:11px;overflow:hidden;background:var(--toolbg)}
.tool summary{cursor:pointer;padding:6px 10px;display:flex;gap:8px;align-items:center;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool .tag{background:var(--lcd-ink);color:var(--lcd);padding:1px 6px;border-radius:3px;font-weight:700;letter-spacing:.06em}
.tool .arg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a523c}
.tool .st{width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:blink 1s steps(2) infinite}
.tool.done .st{background:var(--green);animation:none}
.tool.err .st{background:var(--orange);animation:none}
.tool pre{margin:0;padding:8px 10px;border-top:1px dashed #0004;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:11px}
.sys{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--lcd-mute);text-align:center;border-top:1px dashed #0003;padding-top:8px}
.sys.err{color:var(--orange-d);font-weight:700}
.perm{border:2px solid var(--orange);border-radius:10px;background:var(--toolbg);padding:10px 12px;font-size:11px;display:flex;flex-direction:column;gap:8px}
.perm.done{border-color:var(--lcd-mute);opacity:.75}.perm.done.no{border-color:var(--orange-d)}
.perm .phead{display:flex;gap:8px;align-items:center;min-width:0}
.perm .tag{background:var(--orange);color:var(--on-accent);padding:1px 6px;border-radius:3px;font-weight:700;letter-spacing:.06em;flex:none}
.perm .tag.alt{background:var(--lcd-ink);color:var(--lcd)}
.perm .arg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.perm .pbody{max-height:180px;overflow:auto}
.perm .pacts{display:flex;gap:8px;flex-wrap:wrap}
.perm .pacts .btn{padding:7px 14px;font-size:10px}
.perm .btn.go{background:var(--orange);color:var(--on-accent)}
.perm .pnote{font-size:9.5px;color:var(--lcd-mute);word-break:break-all}
.perm .pres{font-weight:800;letter-spacing:.1em;font-size:10px}
.perm .ptxt{margin-bottom:6px;font-weight:700}

/* controls */
.seg{display:flex;background:var(--well);border-radius:8px;padding:3px;gap:3px;box-shadow:0 1px 3px #0003 inset}
.seg button{flex:1;border:0;background:transparent;font:700 10px var(--sans);letter-spacing:.1em;padding:8px 0;border-radius:6px;cursor:pointer;color:var(--mute)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 22%}
.seg button.on{background:var(--key);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.warn{background:var(--orange);color:var(--on-accent)}
.ctl{display:flex;flex-direction:column;gap:6px}
.btn{border:0;border-radius:10px;padding:12px;font:800 11px var(--sans);letter-spacing:.14em;cursor:pointer;background:var(--key);box-shadow:var(--shadow);color:var(--ink);text-transform:uppercase}
.btn:active{transform:translateY(2px)}
.btn.stop{color:var(--orange-d)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.knobwrap{display:flex;align-items:center;gap:14px}
.knob{width:54px;height:54px;border-radius:50%;background:conic-gradient(from 0deg,#f6f4ef,var(--well),#f6f4ef,var(--well),#f6f4ef);
  box-shadow:0 3px 6px #0004,0 0 0 3px #0001;position:relative;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:4px;height:14px;margin-left:-2px;border-radius:2px;background:var(--orange)}
.hint{font-size:10px;color:var(--mute);line-height:1.4}
.right{min-height:0}
.right .panel.grow{flex:1;min-height:0;display:flex;flex-direction:column}

/* input */
footer{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch}
.inputwrap{background:var(--lcd);border-radius:12px;box-shadow:0 3px 8px #0003 inset,0 1px 0 #fff,0 0 0 1px #0002;display:flex;flex-direction:column;padding:8px 12px}
textarea{width:100%;resize:none;border:0;background:transparent;font:var(--fs)/1.5 var(--bodyfont);color:var(--lcd-ink);outline:none;height:56px}
textarea::placeholder{color:var(--lcd-dim)}
.send{width:120px;border:0;border-radius:14px;background:var(--orange);color:var(--on-accent);font:800 14px var(--sans);letter-spacing:.14em;cursor:pointer;
  box-shadow:0 -3px 0 rgba(0,0,0,.2) inset,0 0 0 2px #fff5 inset,0 3px 0 var(--orange-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.send:active{transform:translateY(3px);box-shadow:0 -3px 0 rgba(0,0,0,.2) inset,0 0 0 2px #fff5 inset}
.send small{font:700 9px var(--mono);opacity:.8;letter-spacing:.05em}
.send:disabled{background:#c9b3a8;cursor:default;box-shadow:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#0003;border-radius:4px}

/* session usage */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sgrid>div{background:var(--lcd);color:var(--lcd-ink);border-radius:6px;padding:6px 9px;box-shadow:0 2px 4px #0003 inset}
.sgrid .k{font:700 8px var(--sans);letter-spacing:.14em;color:var(--lcd-mute)}
.sgrid .v{font:700 14px var(--mono);font-variant-numeric:tabular-nums}
.mrow{display:flex;justify-content:space-between;font:11px var(--mono);padding:3px 0;border-bottom:1px dashed #0002}
.mrow:last-child{border:0}
/* diffs */
.diff{font:11px/1.5 var(--mono);overflow:auto;max-height:340px;border-top:1px dashed #0004;background:var(--toolbg)}
.dl{display:flex;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.dl .g{flex:0 0 22px;text-align:center;opacity:.8;user-select:none;font-weight:700}
.dl .c{flex:1;min-width:0;padding:0 8px 0 6px}
.dl.add{background:rgba(43,212,106,.2)}.dl.add .g{background:rgba(43,212,106,.5);color:#06361a}
.dl.del{background:rgba(255,77,0,.16)}.dl.del .g{background:rgba(255,77,0,.42);color:#5a1b00}
.dl.add mark{background:rgba(43,212,106,.5);color:inherit;border-radius:2px}
.dl.del mark{background:rgba(255,77,0,.4);color:inherit;border-radius:2px}
.dl.hunk{background:rgba(47,91,255,.12);color:var(--lcd-mute);font-style:italic}
.dl.file{background:#0002;font-weight:700}
.dl.skip{background:#0001;color:var(--lcd-mute);font-size:10px;letter-spacing:.06em}
.dl.skip .c{text-align:center}
.tool .stat{display:flex;gap:6px;font:800 10px var(--mono)}
.tool .stat .p{color:#168a45}.tool .stat .m{color:#c93b00}
.body pre .dl{white-space:pre-wrap}
.body pre .dl.add{background:rgba(43,212,106,.22);color:#c4f7d3}.body pre .dl.add .g{color:#c4f7d3;background:rgba(43,212,106,.4)}
.body pre .dl.del{background:rgba(255,77,0,.2);color:#ffd0bb}.body pre .dl.del .g{color:#ffd0bb;background:rgba(255,77,0,.45)}
.body pre .dl.hunk{background:rgba(122,162,255,.15);color:#9db8ff}
.body pre .dl.file{background:#ffffff14;color:#fff}
.body pre .dl.skip{color:#8fa070;background:#ffffff0a}
#tout .ln.add{color:#8fe86a;background:rgba(143,232,106,.1)}
#tout .ln.del{color:#ff8a6b;background:rgba(255,138,107,.1)}
#tout .ln.hunk{color:#6ee0e0}
#tout .ln.file{color:#fff;font-weight:700}
/* avatar display */
.dsp{padding-bottom:10px;flex:1;min-height:0;display:flex;flex-direction:column}
.dsp .avwrap{margin:10px auto 0}
.dsp .avcap{margin:14px 4px 4px}
.avwrap{position:relative;width:calc(100% - 8px);flex:1;min-height:120px;margin:10px auto 0;background:#080907;border-radius:10px;overflow:hidden;cursor:pointer;
  box-shadow:inset 0 0 22px #000,inset 0 0 0 1px #ffffff12,0 0 0 3px #1f211e,0 0 0 4px #0007,0 2px 0 4px #ffffff55}
.avwrap canvas{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 0 3px var(--avglow,transparent))}
.avwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.32) 1px,transparent 1px) 0 0/4px 4px,linear-gradient(90deg,rgba(0,0,0,.32) 1px,transparent 1px) 0 0/4px 4px,
  repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.avwrap::before{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.07),transparent);animation:avroll 6s linear infinite}
@keyframes avroll{to{top:100%}}
/* juice */
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes userin{0%{opacity:0;transform:translateY(10px) scale(.94)}60%{transform:translateY(-1px) scale(1.012)}100%{opacity:1;transform:none}}
@keyframes dotpop{0%{transform:scale(.4)}50%{transform:scale(1.9);box-shadow:0 0 0 5px #7bd96d55}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22);color:var(--orange)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes sendpop{0%{transform:scale(1)}30%{transform:scale(.93)}65%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes cardflash{0%{box-shadow:0 0 0 0 var(--orange)}40%{box-shadow:0 0 0 4px #ff4d0066}100%{box-shadow:0 0 0 0 transparent}}
.msg,.sys{animation:msgin .22s cubic-bezier(.2,.8,.3,1) both}
.msg.user{animation-name:userin;animation-duration:.3s}
.tool{animation:msgin .2s ease-out both}
.tool.done .st,.tool.err .st{animation:dotpop .45s ease-out}
.bump{display:inline-block;animation:bump .4s ease-out}
.shake{animation:shake .38s ease-out}
#btnSend.pop{animation:sendpop .32s ease-out}
button,.pad,.sess{-webkit-tap-highlight-color:transparent}
.btn,.mini{transition:transform .08s,filter .12s}
.btn:active,.mini:active{transform:translateY(1px) scale(.96)}
.btn:hover,.mini:hover{filter:brightness(1.06)}
.pad{transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.pad:hover{transform:translateY(-1px)}
.pad:active{transform:translateY(2px) scale(.97)}
.sess{transition:transform .12s,background .12s}
.sess:hover{filter:brightness(1.05)}
.perm{animation:cardflash .8s ease-out}
@keyframes crtoff{0%{transform:scale(1,1);filter:brightness(1);background-color:transparent;box-shadow:none}35%{background-color:transparent}50%{transform:scale(1,.012);filter:brightness(1.4);background-color:var(--lcd-ink);box-shadow:0 0 18px 4px var(--lcd-ink)}80%{transform:scale(.03,.012);background-color:var(--lcd-ink);box-shadow:0 0 22px 8px var(--lcd-ink)}100%{transform:scale(0,0);opacity:0;background-color:var(--lcd-ink);box-shadow:0 0 30px 10px var(--lcd-ink)}}
@keyframes crton{0%{transform:scale(0,.012);opacity:0;background-color:var(--lcd-ink);box-shadow:0 0 30px 10px var(--lcd-ink)}30%{transform:scale(1,.012);opacity:1;background-color:var(--lcd-ink);box-shadow:0 0 22px 8px var(--lcd-ink)}70%{transform:scale(1,1.01);background-color:color-mix(in srgb,var(--lcd-ink) 28%,transparent);box-shadow:none;filter:brightness(1.5)}100%{transform:none;background-color:transparent;filter:none;box-shadow:none}}

#screen .boot{position:absolute;inset:0;z-index:20;border-radius:inherit;padding:22px 26px;overflow:hidden;cursor:pointer;
  background:repeating-linear-gradient(0deg,#0000 0 2px,#00000040 2px 3px),radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--lcd) 88%,var(--lcd-ink) 12%),var(--lcd) 70%,#000 160%);

#screen .boot.out{opacity:0;filter:brightness(2)}

/* ===== STUDIO: a physical, skeuomorphic skin (brushed aluminium in a walnut case) ===== */
body[data-skin=studio]{background:#150c07;background-image:none}
body[data-skin=studio]::before{content:"";position:fixed;inset:3px;border-radius:30px;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(91deg,#0000 0 5px,#0000000f 5px 6px,#ffffff0a 6px 9px,#00000008 9px 13px),
    linear-gradient(90deg,var(--wd),color-mix(in srgb,var(--wl) 75%,var(--wd)) 14%,color-mix(in srgb,var(--wl) 30%,var(--wd)) 33%,var(--wl) 52%,color-mix(in srgb,var(--wl) 22%,var(--wd)) 71%,color-mix(in srgb,var(--wl) 72%,var(--wd)) 88%,var(--wd));
  box-shadow:0 0 0 2px #0c0603,inset 0 2px 1px #ffffff40,inset 0 -3px 5px #000a,inset 0 0 0 1px #00000040,0 20px 50px #000c}
body[data-skin=studio] .device{z-index:1;border-radius:14px;padding:26px 26px 24px;
  background:repeating-linear-gradient(90deg,#ffffff12 0 1px,#00000008 1px 2px,#0000 2px 4px),
    linear-gradient(180deg,color-mix(in srgb,var(--body) 80%,#fff),var(--body) 35%,color-mix(in srgb,var(--body) 86%,#000));
  box-shadow:0 0 0 1px #4b4f56,0 0 0 2px #00000055,inset 0 2px 0 #ffffff80,inset 0 -2px 2px #0004,inset 2px 0 0 #fff6,inset -2px 0 0 #0002,0 8px 24px #000a}
body[data-skin=studio] .screw{width:13px;height:13px;background:radial-gradient(circle at 34% 28%,#fff 0,#c3c7ce 35%,#757a83 80%,#4f535b);box-shadow:0 1px 2px #000a,0 0 0 1px #3d4046,inset 0 -1px 1px #0005}
body[data-skin=studio] .screw::after{left:1.5px;right:1.5px;top:5.5px;height:2px;background:#2a2d32;box-shadow:0 1px 0 #fff6}
body[data-skin=studio] .logo{text-shadow:0 1px 0 #fffb,0 -1px 0 #0003}
body[data-skin=studio] .logo i{background:radial-gradient(circle at 35% 30%,#fff9 0,#0000 38%),var(--orange);box-shadow:0 0 0 2px #1b1d20,0 1px 0 2px #fff8,0 0 8px color-mix(in srgb,var(--orange) 60%,transparent)}
body[data-skin=studio] .logo small,body[data-skin=studio] .panel .label,body[data-skin=studio] .led .label,body[data-skin=studio] .srow .label{text-shadow:0 1px 0 #ffffff55;color:var(--mute)}
/* panels: recessed trays */
body[data-skin=studio] .panel{background:linear-gradient(180deg,color-mix(in srgb,var(--body-2) 88%,#000),var(--body-2) 14%);border-radius:12px;
  box-shadow:inset 0 3px 6px #0006,inset 0 -1px 0 #ffffff50,inset 1px 0 2px #0003,0 1px 0 #ffffff70,0 0 0 1px #00000050}
/* keys: ivory plastic with a lip and shadow */
body[data-skin=studio] :is(.pad,.btn,.mini,.sess,.seg button.on){border:1px solid color-mix(in srgb,var(--key) 60%,#000);
  background:linear-gradient(180deg,color-mix(in srgb,var(--key) 65%,#fff) 0,var(--key) 40%,color-mix(in srgb,var(--key) 86%,#000) 100%);
  box-shadow:inset 0 1px 0 #ffffffa0,inset 0 -3px 4px #0000001c,0 3px 0 color-mix(in srgb,var(--key) 55%,#000),0 5px 7px #0000005c;color:var(--keyink)}
body[data-skin=studio] :is(.pad,.btn,.mini):active,body[data-skin=studio] .sess:active{transform:translateY(3px);
  box-shadow:inset 0 1px 0 #ffffff80,inset 0 -2px 3px #00000018,0 0 0 #77746a,0 1px 2px #0000006a}

  background:linear-gradient(180deg,color-mix(in srgb,var(--orange) 62%,#fff) 0,var(--orange) 45%,var(--orange-d) 100%);
  box-shadow:inset 0 1px 0 #ffffffb0,inset 0 -3px 5px #0000003a,0 3px 0 color-mix(in srgb,var(--orange-d) 65%,#000),0 5px 8px #0000006a;text-shadow:0 -1px 0 #0003}

/* segmented switches: a milled slot with a raised key */
body[data-skin=studio] .seg{background:linear-gradient(180deg,color-mix(in srgb,var(--well) 80%,#000),var(--well));border-radius:9px;box-shadow:inset 0 3px 5px #0007,inset 0 -1px 0 #ffffff40,0 1px 0 #ffffff60}

body[data-skin=studio] .seg button.on{box-shadow:inset 0 1px 0 #ffffffa0,inset 0 -2px 3px #0000001c,0 2px 0 color-mix(in srgb,var(--key) 55%,#000),0 3px 4px #0006;text-shadow:none;color:var(--keyink)}
/* glass LCDs with black bezels */
body[data-skin=studio] :is(.lcd,main,.inputwrap){border:0;
  background:linear-gradient(158deg,#ffffff38 0,#ffffff0a 34%,#0000 35%),radial-gradient(120% 100% at 50% 0,#0000 55%,#0000002a),var(--lcd);
  box-shadow:inset 0 4px 10px #0000007a,inset 0 0 0 1px #0000002e,0 0 0 4px #17191c,0 0 0 5px #5d626a,0 2px 0 5px #fffa,0 6px 10px 3px #0000004a}
body[data-skin=studio] .lcd-row{gap:14px}
body[data-skin=studio] .lcd{border-radius:5px}
body[data-skin=studio] main{border-radius:8px}
body[data-skin=studio] .inputwrap{border-radius:8px}
body[data-skin=studio] .lcd .label{text-shadow:none;color:var(--lcd-mute)}
body[data-skin=studio] .screenbar{border-bottom-color:#00000030}
body[data-skin=studio] .msg.user .body{background:linear-gradient(180deg,color-mix(in srgb,var(--key) 70%,#fff),var(--key));box-shadow:inset 0 1px 0 #fff,0 2px 0 #77746a55,0 3px 5px #0003}
body[data-skin=studio] .tool{box-shadow:inset 0 2px 4px #0003}
body[data-skin=studio] .avwrap{border-radius:6px;box-shadow:inset 0 0 12px #000,0 0 0 4px #17191c,0 0 0 5px #5d626a,0 2px 0 5px #fffa,0 5px 9px 3px #0000004a}
/* status lamps: glass domes */
body[data-skin=studio] .led i{width:13px;height:13px;background:radial-gradient(circle at 36% 30%,#ffffffb0 0,#fff0 34%),radial-gradient(circle,#53575d,#2c2f33);
  box-shadow:inset 0 -2px 3px #0008,0 0 0 2px #1b1d20,0 0 0 3px #6a6f77,0 2px 0 3px #fffa}
body[data-skin=studio] .led.on i{background:radial-gradient(circle at 36% 30%,#fffffff0 0,#fff0 38%),radial-gradient(circle,color-mix(in srgb,var(--orange) 75%,#fff),var(--orange-d));
  box-shadow:inset 0 -2px 3px #0005,0 0 0 2px #1b1d20,0 0 0 3px #6a6f77,0 2px 0 3px #fffa,0 0 14px 3px color-mix(in srgb,var(--lc) 70%,transparent)}
body[data-skin=studio] .led.green.on i{background:radial-gradient(circle at 36% 30%,#fffffff0 0,#fff0 38%),radial-gradient(circle,#7dffa8,#139a45);
  box-shadow:inset 0 -2px 3px #0005,0 0 0 2px #1b1d20,0 0 0 3px #6a6f77,0 2px 0 3px #fffa,0 0 14px 3px #2bd46a99}
/* knob: turned aluminium */
body[data-skin=studio] .knob{width:58px;height:58px;
  background:radial-gradient(circle at 50% 50%,#0000 0 60%,#0000001f 62%,#0000 66%),conic-gradient(from 20deg,#f6f7f9,#a1a6ae,#fbfcfd,#8a9099,#f6f7f9,#a1a6ae,#fbfcfd,#858b94,#f6f7f9);
  box-shadow:0 0 0 4px #2a2d31,0 0 0 5px #666b73,0 7px 10px 2px #0009,inset 0 2px 2px #fff,inset 0 -3px 5px #0006}
body[data-skin=studio] .knob::after{box-shadow:0 0 4px color-mix(in srgb,var(--orange) 80%,transparent),inset 0 1px 0 #fff8}
/* toggles: slide switches */
body[data-skin=studio] .tog{background:linear-gradient(180deg,#5c6168,#7d838b);box-shadow:inset 0 3px 5px #000a,0 1px 0 #fff9}
body[data-skin=studio] .tog::after{background:radial-gradient(circle at 36% 30%,#fff,#c7ccd3 55%,#8d939b);box-shadow:0 2px 3px #0009,inset 0 -1px 2px #0004}
body[data-skin=studio] .tog.on{background:linear-gradient(180deg,color-mix(in srgb,var(--orange-d) 90%,#000),var(--orange))}
/* sheets & cards */
body[data-skin=studio] .sheet{background:repeating-linear-gradient(90deg,#ffffff12 0 1px,#00000008 1px 2px,#0000 2px 4px),linear-gradient(180deg,color-mix(in srgb,var(--body) 80%,#fff),color-mix(in srgb,var(--body) 90%,#000));
  box-shadow:0 0 0 1px #4b4f56,inset 0 2px 0 #fffc,inset 0 -2px 2px #0004,0 30px 70px #000b}
body[data-skin=studio] .sheet textarea.ed,body[data-skin=studio] .sheet input[type=number]{box-shadow:inset 0 3px 8px #0007,0 0 0 3px #17191c,0 0 0 4px #5d626a,0 1px 0 4px #fffa}
body[data-skin=studio] .acct{box-shadow:inset 0 3px 8px #0007,0 0 0 3px #17191c,0 0 0 4px #5d626a,0 1px 0 4px #fffa}
body[data-skin=studio] .perm{box-shadow:inset 0 2px 4px #0003,0 3px 6px #0004}
body[data-skin=studio] .pbar{box-shadow:inset 0 1px 2px #0005}

/* ===== theme gallery ===== */
.tcat{font:800 9px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.tcat::after{content:"";flex:1;height:1px;background:currentColor;opacity:.25}
.tgal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px;margin-top:6px}
.tgal.s .tp{height:62px}.tgal.w .tp{height:52px}
.tgal .tp-dev{grid-template-columns:22px 1fr;padding:4px;gap:4px}
.tsub{font:800 9px var(--sans);letter-spacing:.18em;color:var(--mute);margin:12px 0 2px;display:flex;align-items:center;gap:8px}
.tsub::after{content:"";flex:1;height:1px;background:currentColor;opacity:.25}
.tgal.w .td{display:none}
.tcard.add .tp{display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:0 0 0 1.5px var(--mute) inset;border-style:dashed}
.tcard.add .tp b{font:300 28px var(--sans);color:var(--mute)}.tcard.add:hover .tp b{color:var(--orange)}
.tcard.add input{width:100%;min-width:0;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;background:var(--key);color:var(--ink);border:1px solid var(--mute);border-radius:5px;padding:5px}
.tcard .tn small{cursor:pointer;font-size:12px;opacity:.7}.tcard .tn small:hover{opacity:1;color:var(--orange)}
.tcard{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;font-family:var(--sans);color:var(--ink);min-width:0}
.tcard .tp{height:76px;border-radius:9px;padding:7px;background:var(--bg);box-shadow:0 0 0 1px #0004;transition:transform .12s,box-shadow .12s}
.tcard:hover .tp{transform:translateY(-2px)}
.tcard.on .tp{box-shadow:0 0 0 2px var(--body),0 0 0 4px var(--orange)}
.tcard .tn{font:800 10px var(--sans);letter-spacing:.12em;display:flex;align-items:center;gap:6px;margin-top:3px}
.tcard .tn small[data-tdel]{font:700 14px var(--sans);letter-spacing:0;padding:0 4px;opacity:.8}
.tcard .tn small{margin-left:auto;font:700 8px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);opacity:.8}
.tcard .tp{position:relative}
.tcard .tick{position:absolute;right:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--orange);color:var(--on-accent);font:800 10px/16px var(--sans);text-align:center;font-style:normal;box-shadow:0 1px 3px #0006}
.tcard .td{font:500 9.5px/1.25 var(--sans);color:var(--mute)}
.tp-dev{height:100%;background:var(--body);border-radius:5px;padding:5px;display:grid;grid-template-columns:30px 1fr;gap:5px}
.tp-pads{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:3px}
.tp-pads i{background:var(--key);border-radius:2px;box-shadow:0 1px 0 #0003}
.tp-pads i.o{background:var(--orange)}
.tp-scr{background:var(--lcd);border-radius:3px;padding:6px 5px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.tp-scr u{display:block;height:2px;background:var(--lcd-ink);opacity:.7;text-decoration:none}
.tp-scr u:nth-child(1){width:70%}.tp-scr u:nth-child(2){width:90%;opacity:.45}.tp-scr u:nth-child(3){width:45%;opacity:.3}
.tcard[data-skin=studio] .tp{background:linear-gradient(90deg,var(--wd),var(--wl) 50%,var(--wd));padding:6px}
.tcard[data-skin=studio] .tp-dev{background:linear-gradient(180deg,var(--body),var(--body-2));box-shadow:inset 0 1px 0 #fff8,inset 0 -1px 1px #0004}
.tcard[data-skin=studio] .tp-pads i{background:linear-gradient(180deg,#fff9,var(--key) 40%,var(--well));box-shadow:0 2px 0 #0006,inset 0 1px 0 #fff}
.tcard[data-skin=studio] .tp-pads i.o{background:linear-gradient(180deg,color-mix(in srgb,var(--orange) 60%,#fff),var(--orange))}
.tcard[data-skin=studio] .tp-scr{box-shadow:0 0 0 2px #17191c,0 0 0 3px #666,inset 0 2px 4px #0006;background:linear-gradient(158deg,#fff3,#0000 40%),var(--lcd)}
.tcard[data-skin=brutal] .tp-dev{border:2px solid var(--edge);border-radius:0;box-shadow:3px 3px 0 var(--edge)}
.tcard[data-skin=brutal] .tp-pads i{border:2px solid var(--edge);border-radius:0;box-shadow:2px 2px 0 var(--edge)}
.tcard[data-skin=brutal] .tp-scr{border:2px solid var(--edge);border-radius:0}
.tcard[data-skin=clay] .tp-dev{border-radius:12px;box-shadow:4px 4px 8px var(--cd),-4px -4px 8px var(--cl)}
.tcard[data-skin=clay] .tp-pads i{border-radius:5px;box-shadow:2px 2px 4px var(--cd),-2px -2px 4px var(--cl)}
.tcard[data-skin=clay] .tp-pads i.o{box-shadow:2px 2px 4px #0003}
.tcard[data-skin=clay] .tp-scr{border-radius:8px;box-shadow:inset 2px 2px 5px var(--cd),inset -2px -2px 5px var(--cl)}
.tcard[data-skin=neon] .tp{background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--g1) 24%,var(--bg)),var(--bg) 75%)}
.tcard[data-skin=neon] .tp-dev{box-shadow:0 0 0 1px color-mix(in srgb,var(--g1) 67%,transparent),0 0 10px color-mix(in srgb,var(--g1) 40%,transparent)}
.tcard[data-skin=neon] .tp-pads i{border:1px solid color-mix(in srgb,var(--g1) 67%,transparent);box-shadow:0 0 5px color-mix(in srgb,var(--g1) 33%,transparent)}
.tcard[data-skin=neon] .tp-pads i.o{box-shadow:0 0 9px var(--orange)}
.tcard[data-skin=neon] .tp-scr{border:1px solid var(--g2);box-shadow:0 0 8px color-mix(in srgb,var(--g2) 53%,transparent),inset 0 0 8px color-mix(in srgb,var(--g2) 20%,transparent)}
.tcard[data-skin=crt] .tp-dev,.tcard[data-skin=crt] .tp-pads i,.tcard[data-skin=crt] .tp-scr{border:1px solid var(--orange);border-radius:1px;box-shadow:0 0 6px #39ff6a44}
.tcard[data-skin=crt] .tp-pads i{background:transparent}.tcard[data-skin=crt] .tp-pads i.o{background:var(--orange)}
.tcard[data-skin=blueprint] .tp{background:linear-gradient(color-mix(in srgb,var(--line) 14%,transparent) 1px,#0000 1px) 0 0/8px 8px,linear-gradient(90deg,color-mix(in srgb,var(--line) 14%,transparent) 1px,#0000 1px) 0 0/8px 8px,var(--bg)}
.tcard[data-skin=blueprint] .tp-dev{background:none;border:1px solid var(--line);border-radius:1px}
.tcard[data-skin=blueprint] .tp-pads i{background:none;border:1px solid var(--line);border-radius:1px;box-shadow:none}.tcard[data-skin=blueprint] .tp-pads i.o{background:var(--orange);border-color:var(--orange)}
.tcard[data-skin=blueprint] .tp-scr{border:1px dashed var(--line);border-radius:1px}

/* ===== SKINS: flat families (brutal · crt · blueprint) share one rule set driven by variables ===== */
body[data-skin=brutal]{--bw:3px;--bc:var(--edge);--r:0px;--off:4px;--offc:var(--edge)}
body[data-skin=crt]{--bw:1px;--bc:color-mix(in srgb,var(--orange) 70%,#000);--r:2px;--off:0px;--offc:#0000;text-shadow:0 0 5px color-mix(in srgb,currentColor 45%,transparent)}
body[data-skin=blueprint]{--bw:1px;--bc:color-mix(in srgb,var(--line) 82%,transparent);--r:2px;--off:0px;--offc:#0000}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]){background-image:none}
body[data-skin=blueprint]{background-image:linear-gradient(color-mix(in srgb,var(--line) 9%,transparent) 1px,#0000 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 9%,transparent) 1px,#0000 1px);background-size:24px 24px}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .screw{display:none}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .device{border-radius:var(--r);border:var(--bw) solid var(--bc);box-shadow:calc(var(--off) * 2.5) calc(var(--off) * 2.5) 0 var(--offc)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .panel{border-radius:var(--r);border:var(--bw) solid var(--bc);box-shadow:none}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) :is(.pad,.btn,.mini,.sess,.seg button.on,.send){border:var(--bw) solid var(--bc);border-radius:var(--r);box-shadow:var(--off) var(--off) 0 var(--offc);background:var(--key);color:var(--ink)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) :is(.pad,.btn,.mini,.sess,.send):active{transform:translate(var(--off),var(--off));box-shadow:0 0 0 var(--offc)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) :is(.pad.on,.mini.o,.btn.go,.seg button.on.warn,.send){background:var(--orange);color:var(--on-accent)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .send:disabled{background:var(--well);color:var(--mute);box-shadow:none}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) :is(.lcd,main,.inputwrap,.avwrap){border:var(--bw) solid var(--bc);border-radius:var(--r);box-shadow:var(--off) var(--off) 0 var(--offc)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .seg{border:var(--bw) solid var(--bc);border-radius:var(--r);box-shadow:none;padding:2px;background:var(--well)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .seg button{border-radius:var(--r)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .seg button.on{box-shadow:none;background:var(--ink);color:var(--body)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .seg button.on.warn{background:var(--orange);color:var(--on-accent)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) :is(.tog,.tog::after){border-radius:var(--r)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .tog{border:var(--bw) solid var(--bc);box-shadow:none;background:var(--well)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .tog.on{background:var(--orange)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .tog::after{box-shadow:none;border:var(--bw) solid var(--bc);top:1px;background:var(--key)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .knob{background:var(--key);border:var(--bw) solid var(--bc);box-shadow:var(--off) var(--off) 0 var(--offc)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .led i{border:var(--bw) solid var(--bc);border-radius:var(--r);box-shadow:none}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) .sheet{border:var(--bw) solid var(--bc);border-radius:var(--r);box-shadow:calc(var(--off) * 2.5) calc(var(--off) * 2.5) 0 var(--offc)}
body:is([data-skin=brutal],[data-skin=crt],[data-skin=blueprint],[data-skin=runner],[data-skin=retro],[data-skin=basic]) :is(.tool,.perm,.msg.user .body){border-radius:var(--r)}
body[data-skin=crt] :is(.lcd,main,.inputwrap){background:repeating-linear-gradient(0deg,#0000 0 2px,#00000066 2px 3px),var(--lcd)}
body[data-skin=crt] :is(.pad,.btn,.mini,.sess,.seg button.on):not(.on):not(.o):not(.go){background:transparent}
body[data-skin=crt] .logo,body[data-skin=crt] .panel .label{text-shadow:0 0 8px color-mix(in srgb,var(--orange) 70%,transparent)}
body[data-skin=blueprint] :is(.panel){background:transparent;border-style:dashed}
body[data-skin=blueprint] .device{background:linear-gradient(color-mix(in srgb,var(--line) 6%,transparent) 1px,#0000 1px) 0 0/24px 24px,linear-gradient(90deg,color-mix(in srgb,var(--line) 6%,transparent) 1px,#0000 1px) 0 0/24px 24px,var(--body)}
body[data-skin=blueprint] :is(.pad,.btn,.mini,.sess,.seg button.on):not(.on):not(.o):not(.go){background:transparent}
body[data-skin=brutal] .logo{text-transform:uppercase}


/* ===== SKIN basic: flat and quiet. White (or near-black) page, hairline borders, no shadows, one accent ===== */
body[data-skin=basic]{--bw:1px;--bc:color-mix(in srgb,var(--ink) 14%,transparent);--r:8px;--off:0px;--offc:#0000}
body[data-skin=basic] .device{border-color:transparent;box-shadow:none;background:var(--body)}
body[data-skin=basic] .panel{background:transparent}
body[data-skin=basic] :is(.pad,.btn,.mini,.sess,.seg button.on):not(.on):not(.o):not(.go){background:transparent}
body[data-skin=basic] :is(.pad,.btn,.mini,.sess):not(.on):not(.o):not(.go):hover{background:var(--well)}
body[data-skin=basic] :is(.lcd,main,.inputwrap,.avwrap){background:var(--lcd);box-shadow:none}
body[data-skin=basic] .logo{font-weight:600;letter-spacing:.32em}
body[data-skin=basic] .led i{box-shadow:none}
body[data-skin=basic] .avwrap{box-shadow:none;background:var(--lcd)}
body[data-skin=basic] :is(.avwrap::after,.avwrap::before,.gloss){display:none}
body[data-skin=basic] #screen .boot{background:var(--lcd);text-shadow:none}
.tcard[data-skin=basic] .tp{background:var(--bg)}
.tcard[data-skin=basic] .tp-dev{background:none;border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:5px;box-shadow:none}
.tcard[data-skin=basic] .tp-pads i{background:none;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:3px;box-shadow:none}.tcard[data-skin=basic] .tp-pads i.o{background:var(--orange);border-color:var(--orange)}
.tcard[data-skin=basic] .tp-scr{border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:3px;box-shadow:none}

/* ===== SKIN runner: acid neon, cut corners, hazard trim (Marathon-inspired) ===== */
body[data-skin=runner]{--bw:2px;--bc:var(--edge);--r:0px;--off:0px;--offc:#0000;background-image:none}
body[data-skin=runner] .device{clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px));border:0;box-shadow:none;overflow:hidden}
body[data-skin=runner] .device::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;z-index:3;pointer-events:none;background:repeating-linear-gradient(135deg,var(--orange) 0 9px,#000 9px 18px)}
body[data-skin=runner] .device::after{content:"";position:absolute;right:44px;bottom:5px;width:96px;height:8px;pointer-events:none;opacity:.8;
  background:repeating-linear-gradient(90deg,var(--orange) 0 2px,#0000 2px 4px,var(--orange) 4px 5px,#0000 5px 8px,var(--orange) 8px 11px,#0000 11px 13px)}
body[data-skin=runner] .panel{border:0;box-shadow:inset 3px 0 0 var(--orange);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
body[data-skin=runner] :is(.pad,.btn,.send){clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
body[data-skin=runner] :is(.mini,.sess){clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%)}
body[data-skin=runner] :is(.lcd,main,.avwrap){clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));border-color:var(--orange);border-width:1px}
body[data-skin=runner] .inputwrap{border-color:var(--orange);border-width:1px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
body[data-skin=runner] :is(.lcd,main){background-image:radial-gradient(color-mix(in srgb,var(--lcd-ink) 14%,transparent) 1px,transparent 1.3px);background-size:6px 6px}
body[data-skin=runner] :is(.label,.logo,.pad .n,.seg button,.btn,.mini,.send){text-transform:uppercase;font-weight:800;letter-spacing:.12em}
body[data-skin=runner] .logo{font-style:italic;letter-spacing:-.02em}
body[data-skin=runner] .seg button.on{background:var(--orange);color:var(--on-accent)}
body[data-skin=runner] .led.on i{box-shadow:0 0 8px var(--lc)}
.tcard[data-skin=runner] .tp-dev{border:0;border-radius:0;border-top:3px solid var(--orange);box-shadow:inset 2px 0 0 var(--orange)}
.tcard[data-skin=runner] .tp-pads i{border:0;border-radius:0}
.tcard[data-skin=runner] .tp-scr{border:1px solid var(--orange);border-radius:0}
/* ===== RETRO: beige 80s home computer, phosphor screen, rainbow stripe ===== */
body[data-skin=retro]{--bw:2px;--bc:var(--edge);--r:7px;--off:0px;--offc:#0000;--rb:linear-gradient(90deg,#61bb46 0 16.66%,#fdb827 0 33.33%,#f5821f 0 50%,#e03a3e 0 66.66%,#963d97 0 83.33%,#009ddc 0)}

/* ===== sessions: actions, filter · context gauge · queue ===== */
.sess{position:relative;min-width:0;flex:none}
.sess .t{padding-right:46px}
.sess .sact{position:absolute;top:4px;right:5px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.sess:hover .sact,.sess:focus-within .sact,.sess .sact:has(.arm){opacity:1}
@media (hover:none){.sess .sact{opacity:.7}}
.sess .sact b{font:700 11px var(--sans);min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;cursor:pointer}
.sess .sact b:hover{background:#0002}
.sess .sact b.arm{background:var(--orange);color:var(--on-accent);padding:0 5px;letter-spacing:.06em;font-size:9px}
.sess input.rn{width:100%;font:inherit;background:var(--lcd);color:var(--lcd-ink);border:0;border-radius:4px;padding:2px 4px;box-shadow:inset 0 1px 3px #0004}
.sq{width:100%;margin:0 0 6px;font:11px var(--mono);background:var(--lcd);color:var(--lcd-ink);border:0;border-radius:6px;padding:5px 8px;box-shadow:0 2px 4px #0003 inset}
.ctx{border:0;background:none;color:inherit;font:inherit;display:flex;align-items:center;gap:6px;flex:none;cursor:pointer;padding:0 8px;letter-spacing:.1em}
.ctx[hidden]{display:none}
.ctx i{width:72px;height:7px;border-radius:4px;background:var(--lcd-faint);overflow:hidden;box-shadow:0 1px 2px #0003 inset}
.ctx b{display:block;height:100%;width:0;background:var(--lcd-ink);transition:width .3s,background .3s}
.ctx.warn b{background:var(--yellow)}.ctx.hot b{background:var(--orange)}.ctx.hot em{color:var(--orange)}
.ctx em{font-style:normal;min-width:3ch;text-align:right}
#queueBar{display:flex;align-items:center;gap:8px;padding:4px 8px 0;font-size:11px;min-width:0}
#queueBar[hidden]{display:none}
#queueBar .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--lcd-mute)}
.send.q{background:var(--ink);color:var(--body)}
/* ===== phone layout (remote control over Wi-Fi) ===== */
.mnav,.mclose{display:none}

  .tgal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .screenbar{font-size:9px}
}

<script>
const $ = s => document.querySelector(s);
const state = { project: null, sessionId: null, model: '', mode: 'default', effort: '', busy: false, turns: 0, cost: 0, tokens: 0, ctrl: null };
const HINTS = {
  default: 'asks before edits & shell',
  manual: 'asks before edits & shell',
  auto: 'a classifier approves safe actions · asks if unsure',
  dontAsk: 'never asks · only pre-approved tools run',
  acceptEdits: 'edits auto · asks for shell',
  plan: 'explore & plan · asks to proceed',
  bypassPermissions: '⚠ everything allowed incl. shell'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- markdown (small, escape-first) ----------
// ---------- diffs ----------
const dRow = (cls, g, c) => `<div class="dl ${cls}"><span class="g">${g}</span><span class="c">${c}</span></div>`;
function looksDiff(s) { return /^(diff --git |@@ -\d|--- a\/|\+\+\+ b\/)/m.test(s); }
function lineDiff(a, b) {
  const n = a.length, m = b.length; let p = 0;
  while (p < n && p < m && a[p] === b[p]) p++;
  let q = 0; while (q < n - p && q < m - p && a[n - 1 - q] === b[m - 1 - q]) q++;
  const A = a.slice(p, n - q), B = b.slice(p, m - q), N = A.length, M = B.length, ops = [];
  for (let i = 0; i < p; i++) ops.push({ t: ' ', s: a[i] });
  if (N * M > 2.5e5) { A.forEach(s => ops.push({ t: '-', s })); B.forEach(s => ops.push({ t: '+', s })); }
  else {
    const L = Array.from({ length: N + 1 }, () => new Uint16Array(M + 1));
    for (let i = N - 1; i >= 0; i--) for (let j = M - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    let i = 0, j = 0;
    while (i < N && j < M) {
      if (A[i] === B[j]) { ops.push({ t: ' ', s: A[i] }); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) ops.push({ t: '-', s: A[i++] }); else ops.push({ t: '+', s: B[j++] });
    }
    while (i < N) ops.push({ t: '-', s: A[i++] }); while (j < M) ops.push({ t: '+', s: B[j++] });
  }
  for (let i = n - q; i < n; i++) ops.push({ t: ' ', s: a[i] });
  return ops;
}
function innerMark(a, b) { // highlight just the part of a changed line that differs
  const lim = Math.min(a.length, b.length); let p = 0; while (p < lim && a[p] === b[p]) p++;
  let s = 0; while (s < lim - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  if (p + s < 0.3 * Math.max(a.length, b.length) || (p + s >= a.length && p + s >= b.length)) return [esc(a), esc(b)];
  const f = x => esc(x.slice(0, p)) + (x.length - p - s > 0 ? `<mark>${esc(x.slice(p, x.length - s))}</mark>` : '') + esc(x.slice(x.length - s));
  return [f(a), f(b)];
}
function opsHtml(ops, cap = 500) {
  const keep = new Array(ops.length).fill(false);
  ops.forEach((o, i) => { if (o.t !== ' ') for (let k = Math.max(0, i - 2); k <= Math.min(ops.length - 1, i + 2); k++) keep[k] = true; });
  let html = '', rows = 0, add = 0, del = 0, i = 0;
  while (i < ops.length) {
    if (rows >= cap) { html += dRow('skip', '', `… ${ops.length - i} more lines`); break; }
    if (!keep[i]) { let j = i; while (j < ops.length && !keep[j]) j++; html += dRow('skip', '', `⋯ ${j - i} unchanged line${j - i > 1 ? 's' : ''}`); i = j; rows++; continue; }
    if (ops[i].t === ' ') { html += dRow('', ' ', esc(ops[i].s)); i++; rows++; continue; }
    const ds = [], as = [];
    while (i < ops.length && ops[i].t !== ' ') (ops[i].t === '-' ? ds : as).push(ops[i++].s);
    const dh = ds.map(s => esc(s)), ah = as.map(s => esc(s));
    for (let k = 0; k < Math.min(ds.length, as.length); k++) if (ds[k] !== as[k]) [dh[k], ah[k]] = innerMark(ds[k], as[k]);
    dh.forEach(x => { html += dRow('del', '−', x); }); ah.forEach(x => { html += dRow('add', '+', x); });
    del += ds.length; add += as.length; rows += ds.length + as.length;
  }
  return { html, add, del };
}
function editDiff(name, i) {
  i = i || {}; const secs = [];
  if (name === 'Edit') secs.push([i.old_string, i.new_string]);
  else if (name === 'MultiEdit') (i.edits || []).forEach(e => secs.push([e.old_string, e.new_string]));
  else if (name === 'Write') secs.push(['', i.content]);
  else if (name === 'NotebookEdit') secs.push(['', i.new_source]);
  else return null;
  if (!secs.length || secs.every(s => typeof s[0] !== 'string' && typeof s[1] !== 'string')) return null;
  const file = i.file_path || i.notebook_path || '';
  let html = file ? dRow('file', '', esc(file)) : '', add = 0, del = 0;
  secs.forEach((s, k) => {
    const lines = x => (typeof x === 'string' && x !== '' ? x.split('\n') : []);
    const r = opsHtml(lineDiff(lines(s[0]), lines(s[1]))); add += r.add; del += r.del;
    html += (k ? dRow('skip', '', '·····') : '') + r.html;
  });
  return { html, add, del };
}
function diffText(txt, escaped, cap = 600) { // colourise unified-diff text
  const lines = String(txt).split('\n'); let o = '';
  lines.slice(0, cap).forEach(l => {
    const e = escaped ? l : esc(l), c = l[0];
    if (/^(diff --git|index |\+\+\+ |--- |new file|deleted file|similarity|rename )/.test(l)) o += dRow('file', '', e);
    else if (c === '@') o += dRow('hunk', '', e);
    else if (c === '+') o += dRow('add', '+', e.slice(1));
    else if (c === '-') o += dRow('del', '−', e.slice(1));
    else o += dRow('', ' ', c === ' ' ? e.slice(1) : e);
  });
  if (lines.length > cap) o += dRow('skip', '', `… ${lines.length - cap} more lines`);
  return o;
}
function toolParts(name, input) {
  const i = input || {};
  const arg = i.file_path || i.notebook_path || i.command || i.pattern || i.path || i.url || i.description || JSON.stringify(i).slice(0, 80);
  const d = editDiff(name, i);
  return { arg, diff: !!d, stat: d ? `<span class="stat"><b class="p">+${d.add}</b><b class="m">−${d.del}</b></span>` : '',
    body: d ? `<div class="diff">${d.html}</div>` : `<pre>${esc(JSON.stringify(i, null, 2))}</pre>` };
}
function resultEl(txt) {
  txt = String(txt || '').slice(0, 20000);
  if (looksDiff(txt)) { const d = document.createElement('div'); d.className = 'diff'; d.innerHTML = diffText(txt, false); return d; }
  const p = document.createElement('pre'); p.textContent = txt.slice(0, 4000); return p;
}

const codeBlock = (l, c) => `<pre><code>${/^(diff|patch)$/.test(l) || looksDiff(c) ? diffText(c, true) : c}</code></pre>`;
function md(src) {
  const blocks = [];
  let t = esc(src).replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => { blocks.push(codeBlock(l, c.replace(/\n$/, ''))); return `\u0000${blocks.length - 1}\u0000`; });
  t = t.replace(/```(\w*)\n?([\s\S]*)$/, (_, l, c) => { blocks.push(codeBlock(l, c)); return `\u0000${blocks.length - 1}\u0000`; }); // unterminated while streaming
  t = t.split(/\n{2,}/).map(p => {
    if (/^\u0000\d+\u0000$/.test(p.trim())) return p;
    if (p.trim().split('\n').every(l => l.trim().startsWith('|')) && p.trim().split('\n').length > 1) {
      const rows = p.trim().split('\n').filter(l => !/^\|[\s:|-]+\|?$/.test(l.trim())).map(l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
      return '<table><thead><tr>' + rows[0].map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' + rows.slice(1).map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
    }
    if (/^#{1,3} /.test(p)) return `<h3>${p.replace(/^#+ /, '')}</h3>`;
    if (/^([-*] .*(\n|$))+$/.test(p)) return '<ul>' + p.trim().split('\n').map(l => `<li>${l.slice(2)}</li>`).join('') + '</ul>';
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

// ---------- UI helpers ----------
const log = $('#log');
const scroll = () => { log.scrollTop = log.scrollHeight; };
function addMsg(who, html, cls = '') {
  const e = log.querySelector('.empty'); if (e) e.remove();
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  d.innerHTML = `<div class="who">${who}</div><div class="body"></div>`;
  d.querySelector('.body').innerHTML = html; log.appendChild(d); scroll(); return d.querySelector('.body');
}
function addSys(text, err) {
  const d = document.createElement('div'); d.className = 'sys' + (err ? ' err' : ''); d.textContent = text; log.appendChild(d); scroll();
}
function setBusy(b) {
  state.busy = b; document.body.classList.toggle('busy', b); $('#btnStopM').disabled = !b; $('#ledBusy').classList.toggle('on', b); $('#btnStop').disabled = !b; $('#btnSend').classList.toggle('q', b); $('#btnSend').firstChild.nodeValue = b ? 'QUEUE' : 'SEND';
  if (b) setAvatar('thinking'); else if (['thinking', 'writing', 'tool'].includes(AV.state)) setAvatar('idle');
}
function refresh() {
  const bumpTo = (id, v) => { const el = $(id); if (el.textContent !== v) { const had = el.textContent !== '' && el.textContent !== '—'; el.textContent = v; if (had) jiggle(el, 'bump'); } };
  bumpTo('#vCost', '$' + state.cost.toFixed(2));
  bumpTo('#vTok', shortN(state.tokens));
  $('#turns').textContent = String(state.turns).padStart(2, '0');
  $('#sid').textContent = state.sessionId ? state.sessionId.slice(0, 8) : '—';
  $('#ledSess').classList.toggle('on', !!state.sessionId);
  $('#knob').style.transform = `rotate(${(state.turns % 12) * 30 - 150}deg)`;
  $('#sbProj').textContent = state.project ? state.project.toUpperCase() : 'NO PROJECT';
  $('#sbModel').textContent = (state.model || 'auto').toUpperCase() + ' · ' + ({default:'ASK',auto:'AUTO',acceptEdits:'EDIT',plan:'PLAN',dontAsk:'DENY',bypassPermissions:'YOLO'})[state.mode] || String(state.mode || 'ASK').toUpperCase() + (state.effort ? ' · ' + state.effort.toUpperCase() : '');
  $('#modeHint').textContent = HINTS[state.mode]; $('#modeHint').classList.toggle('warn', state.mode === 'bypassPermissions');
  updateAvatar();
}
function seg(id, key) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.classList.remove('on', 'warn'));
    b.classList.add('on'); if (b.dataset.warn) b.classList.add('warn');
    state[key] = b.dataset.v; refresh();
  });
}
seg('#segModel', 'model'); seg('#segMode', 'mode'); seg('#segEffort', 'effort');

const ctxWindow = (used, model, declared) => declared || (/\[1m\]/.test(model || '') || used > 2e5 ? 1e6 : 2e5);
function drawCtx() {
  const g = $('#ctxG'), c = state.ctx; if (!c || !c.used) { g.hidden = true; return; }
  const pct = Math.min(100, c.used / c.win * 100);
  g.hidden = false; g.querySelector('b').style.width = pct + '%'; g.querySelector('em').textContent = Math.round(pct) + '%';
  g.className = 'ctx' + (pct >= 90 ? ' hot' : pct >= 70 ? ' warn' : ''); g.title = `context ${shortN(c.used)} / ${shortN(c.win)} tokens · click to prepare /compact`;
}
$('#ctxG').onclick = () => { $('#input').value = '/compact'; $('#input').focus(); };
function reset() {
  state.sessionId = null; state.turns = 0; state.cost = 0; state.tokens = 0; state.ctx = null; drawCtx(); $('#vTime').textContent = fmtClock(0);
  log.innerHTML = '<div class="empty"><div class="big">CC-1</div>new session · type something</div>'; refresh();
}

// ---------- projects ----------
const J = { 'Content-Type': 'application/json' };
function loadProjects(select) {
  return fetch('/api/projects').then(r => r.json()).then(({ projects }) => {
    $('#pads').innerHTML = ''; $('#pcount').textContent = String(projects.length).padStart(2, '0');
    const want = select || localStorage.getItem('cc1.project'); let hit = null;
    projects.forEach((p, i) => {
      const b = document.createElement('div'); b.className = 'pad'; b.tabIndex = 0; b.dataset.path = p.path; b.title = p.path;
      b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${esc(p.name)}</span><span class="x" title="Remove from list">×</span>`;
      b.onclick = () => selectProject(p.path);
      b.querySelector('.x').onclick = async e => {
        e.stopPropagation(); if (state.busy) return;
        await fetch('/api/projects/remove', { method: 'POST', headers: J, body: JSON.stringify({ path: p.path }) });
        if (state.project === p.path) { state.project = null; reset(); $('#sess').innerHTML = ''; }
        loadProjects();
      };
      $('#pads').appendChild(b); if (p.path === want) hit = p.path;
    });
    if (!projects.length) $('#pads').innerHTML = '<div class="hint" style="grid-column:1/-1">No projects yet.<br>Click <b>+ FOLDER</b> to add one.</div>';
    if (hit) selectProject(hit, true); else markPads();
  });
}
function markPads() { document.querySelectorAll('.pad').forEach(x => x.classList.toggle('on', x.dataset.path === state.project)); }
function selectProject(p, force) {
  if (state.busy || (!force && p === state.project)) return;
  const go = () => { state.project = p; localStorage.setItem('cc1.project', p); reset(); markPads(); loadSessions(); if (typeof termPrompt === 'function') termPrompt(); };
  if (force) return go();
  return crtSwap(async () => { go(); await bootScreen(p); });
}
async function addFolder(p) {
  const r = await fetch('/api/projects/add', { method: 'POST', headers: J, body: JSON.stringify({ path: p }) });
  const j = await r.json(); if (!r.ok) return addSys(j.error, true);
  await loadProjects(j.added);
}
window.cc1Picked = addFolder;
$('#btnAdd').onclick = () => {
  const h = window.webkit && webkit.messageHandlers && webkit.messageHandlers.pickFolder;
  if (window.cc1Native) cc1Native.pickFolder().then(p => { if (p) addFolder(p); });
  else if (h) h.postMessage(''); else { const p = prompt('Absolute path of the folder to add:'); if (p) addFolder(p); }
};

// ---------- sessions ----------
function ago(ms) { const m = (Date.now() - ms) / 60000; return m < 1 ? 'just now' : m < 60 ? Math.floor(m) + 'm ago' : m < 1440 ? Math.floor(m / 60) + 'h ago' : Math.floor(m / 1440) + 'd ago'; }
let sessAll = [];
async function loadSessions() {
  if (!state.project) return;
  const { sessions = [] } = await fetch('/api/sessions?project=' + encodeURIComponent(state.project)).then(r => r.json());
  sessAll = sessions; renderSessions();
}
function renderSessions() {
  const box = $('#sess'), q = $('#sessQ'), term = q.value.trim().toLowerCase();
  q.hidden = sessAll.length < 6 && !term;
  const list = term ? sessAll.filter(s => s.title.toLowerCase().includes(term) || s.id.startsWith(term)) : sessAll;
  box.innerHTML = list.length ? '' : `<div class="sess none">${sessAll.length ? 'no matches' : 'no sessions yet'}</div>`;
  list.forEach(s => {
    const b = document.createElement('div'); b.className = 'sess' + (s.id === state.sessionId ? ' on' : ''); b.dataset.id = s.id; b.tabIndex = 0; b.setAttribute('role', 'button');
    b.innerHTML = `<span class="t">${esc(s.title)}</span><span class="d">${ago(s.mtime)} · ${s.id.slice(0, 6)}</span><span class="sact"><b data-s="ren" title="Rename">✎</b><b data-s="md" title="Copy as markdown">⧉</b><b data-s="del" title="Delete">✕</b></span>`;
    box.appendChild(b);
  });
}
$('#sessQ').addEventListener('input', renderSessions);
function renameInline(row) {
  const id = row.dataset.id, cur = sessAll.find(x => x.id === id), t = row.querySelector('.t');
  const inp = document.createElement('input'); inp.className = 'rn'; inp.value = cur ? cur.title : ''; inp.maxLength = 120; t.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    if (save) { try { await post('/api/session/rename', { project: state.project, id, title: inp.value }); } catch (e) { addSys('rename failed: ' + e.message, true); } }
    loadSessions();
  };

function poseFor(st, v, t, pt) {
  const P = { dx: 0, dy: 0, look: 0, lookY: 0, eye: 'open', mouth: 'none', armL: 0, armR: 0, walk: false, fx: [], pulse: 2 };
  const alt = r => Math.floor(t * r) % 2;

      else if (v === 1) { const k = t % 2.2; P.dy = k < .6 ? -Math.round(Math.sin(k / .6 * Math.PI) * 4) : 0; P.eye = k < .6 ? 'happy' : P.eye; }
      else if (v === 2) { P.mouth = 'o'; P.dx = Math.round(Math.sin(t * 2)); P.look = Math.round(Math.sin(t * 2)); P.fx.push('notes'); }
      else if (v === 3) { const k = t % 4.5; if (k < 1.6) { P.armL = P.armR = -5; P.eye = 'happy'; P.mouth = 'o'; } }
      else if (v === 4) { const k = t % 6; P.look = k < 3 ? -1 : 1; P.lookY = -1; if (k % 3 > 1.2) P.fx.push('q'); }

    case 'typing': P.lookY = 1; P.dy = Math.sin(t * 5) > .6 ? -1 : 0; P.armL = alt(10); P.armR = 1 - P.armL; P.fx.push('cursor'); P.pulse = 4; break;
    case 'thinking':
      P.look = [-1, 0, 1, 0][Math.floor(t * 2.5) % 4]; P.lookY = -1; P.mouth = 'o'; P.dy = Math.sin(t * 4) > .5 ? -1 : 0; P.pulse = 5;

    case 'writing':
      P.look = 1; P.pulse = 3;

      else if (v === 1) { P.lookY = 1; P.armL = alt(14); P.armR = 1 - P.armL; P.fx.push('code'); }

window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragN++; document.body.classList.add('drag'); } });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragN <= 0) { dragN = 0; document.body.classList.remove('drag'); } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; document.body.classList.remove('drag'); addFiles([...e.dataTransfer.files]); });

// ---------- chat ----------
const queue = [];
function renderQueue() {
  const q = $('#queueBar'); q.hidden = !queue.length; if (!queue.length) return;
  q.innerHTML = `<span class="tag">QUEUED ${queue.length}</span><span class="qt">${esc((queue[0].prompt || '(attachment)').slice(0, 90))}</span><button class="mini" data-qclear>CLEAR</button>`;
}
$('#queueBar').addEventListener('click', e => { if (e.target.closest('[data-qclear]')) { queue.length = 0; renderQueue(); } });
async function send() {
  const prompt = $('#input').value.trim();
  if (!prompt && !atts.length) return;
  if (state.busy) { queue.push({ prompt, atts: atts.splice(0) }); $('#input').value = ''; closeSlash(); renderTray(); renderQueue(); return; }
  if (prompt.startsWith('/') && !atts.length) {
    const [name, arg] = prompt.slice(1).trim().split(/\s+/);
    if (name === 'clear' || name === 'new') { $('#input').value = ''; closeSlash(); reset(); loadSessions(); return addSys('new session'); }
    if (name === 'model') {
      $('#input').value = ''; closeSlash(); const v = (arg || '').toLowerCase().replace('auto', '').replace('default', '');
      const b = $(`#segModel button[data-v="${v}"]`);
      if (b && ['', 'haiku', 'sonnet', 'opus'].includes(v)) { b.click(); return addSys('model → ' + (v || 'auto')); }
      return addSys('usage: /model haiku | sonnet | opus | auto', true);
    }
  }
  closeSlash();
  if (!state.project) return addSys('select a project pad first', true);
  const sending = atts.splice(0); renderTray();
  $('#input').value = '';
  const thumbs = sending.filter(a => a.isImg).map(a => `<img src="data:${a.type};base64,${a.data}" alt="">`).join('');
  const files = sending.filter(a => !a.isImg).map(a => `📎 ${esc(a.name)}`).join('<br>');
  addMsg('YOU', (thumbs ? `<div class="thumbs">${thumbs}</div>` : '') + (files ? files + '<br>' : '') + esc(prompt), 'user'); setBusy(true);
  const t0 = performance.now(); const timer = setInterval(() => $('#vTime').textContent = fmtClock(performance.now() - t0), 100);
  state.ctrl = new AbortController();

  let cur = null, curText = '', streamed = false, shown = false; const tools = {};
  const startText = () => { curText = ''; cur = addMsg('CLAUDE', ''); cur.classList.add('cursor'); };
  const endText = () => { if (cur) { cur.classList.remove('cursor'); cur = null; } };

  function onEvent(ev) {
    if (ev.type === 'system' && ev.subtype === 'init') { state.sessionId = ev.session_id; state.liveModel = ev.model; updateAvatar(); if (ev.slash_commands) { try { localStorage.setItem('cc1.cmds', JSON.stringify(ev.slash_commands)); } catch {} } if (ev.model) {
        const want = state.model || cliModel, wrong = want && !ev.model.toLowerCase().includes(want);
        addSys('model ' + ev.model + ' · ' + (ev.tools || []).length + ' tools' + (wrong ? ' · ⚠ ' + (state.model ? 'you picked ' : 'settings say ') + want.toUpperCase() : ''), !!wrong);
      } refresh(); }
    else if (ev.type === 'stream_event') {
      const e = ev.event;
      if (e.type === 'message_start') streamed = false;
      if (e.type === 'content_block_start' && e.content_block && e.content_block.type === 'tool_use') setAvatar('tool', e.content_block.name);
      if (e.type === 'content_block_delta' && e.delta.type === 'text_delta') {
        streamed = true; shown = true; setAvatar('writing'); if (!cur) startText(); curText += e.delta.text; cur.innerHTML = md(curText); scroll();
      }
      if (e.type === 'content_block_stop') { endText(); if (AV.state === 'writing') setAvatar('thinking'); }
    }
    else if (ev.type === 'system' && ev.subtype === 'compact_boundary') { addSys('context compacted'); state.ctx = null; drawCtx(); }
    else if (ev.type === 'assistant') {
      const syn = ev.message.model === '<synthetic>', u = ev.message.usage;
      if (u && !syn && !ev.parent_tool_use_id) { const used = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.output_tokens || 0); state.ctx = { used, win: state.ctx && state.ctx.win >= used ? state.ctx.win : ctxWindow(used, ev.message.model) }; drawCtx(); }
      for (const c of ev.message.content || []) {
        if (c.type === 'text' && !streamed && c.text.trim()) { addMsg(syn ? 'SYSTEM' : 'CLAUDE', md(c.text)); shown = true; }
        if (c.type === 'tool_use') { addTool(c); setAvatar('tool', c.name); }
      }
    }
    else if (ev.type === 'user') {
      const uc = ev.message.content;
      if (typeof uc === 'string') { const m = uc.match(/<local-command-stdout>([\s\S]*?)<\/local-command-stdout>/); if (m && m[1].trim()) addSys(m[1].trim()); }
      else for (const c of (uc || [])) if (c.type === 'tool_result') { finishTool(c); setAvatar('thinking'); }
    }
    else if (ev.type === 'result') {
      if (ev.session_id) state.sessionId = ev.session_id;
      state.turns++; if (ev.modelUsage) state.cost = ev.total_cost_usd || 0; else state.cost += ev.total_cost_usd || 0; setAvatar(ev.is_error ? 'error' : 'happy'); if (ev.is_error) { jiggle($('#avWrap'), 'shake'); chime('err'); } else { burst(36, 'up'); chime('done'); }
      const mu = Object.values(ev.modelUsage || {}), cwin = Math.max(0, ...mu.map(x => x.contextWindow || 0));
      if (cwin && state.ctx) { state.ctx.win = cwin; drawCtx(); }
      if (mu.length) state.tokens = mu.reduce((n, x) => n + (x.inputTokens || 0) + (x.outputTokens || 0) + (x.cacheReadInputTokens || 0) + (x.cacheCreationInputTokens || 0), 0);
      else { const u = ev.usage || {}; state.tokens += (u.input_tokens || 0) + (u.output_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0); }
      if (!shown && ev.result && !ev.is_error) addMsg('SYSTEM', md(ev.result));
      if (ev.is_error) addSys(ev.result || 'error', true); else addSys(`done · ${((ev.duration_ms || 0) / 1000).toFixed(1)}s`);
      if (!queue.length) notify(ev.is_error ? 'CC-1 · error' : 'CC-1 · task complete', ev.result || (ev.is_error ? 'the task failed' : 'done'));
      refresh();
    }
    else if (ev.type === 'rate_limit_event') { const w = ev.rate_limit_info && ev.rate_limit_info.unifiedWindows; if (w && w.five_hour) setUsageBtn(w.five_hour.utilization * 100, w.seven_day ? w.seven_day.utilization * 100 : null); }
    else if (ev.type === 'control_request' && ev.request && ev.request.subtype === 'can_use_tool') askCard(ev), notify('CC-1 · needs approval', 'Claude wants to use ' + ((ev.request || {}).tool_name || 'a tool'));
    else if (ev.type === 'control_cancel_request') { const c = log.querySelector(`.perm[data-id="${ev.request_id}"]`); if (c) closeCard(c, 'CANCELLED'); }
    else if (ev.type === 'cc1_error') { addSys(ev.message, true); setAvatar('error'); }
  }

  function closeCard(card, label, cls) { card.classList.add('done'); if (cls) card.classList.add(cls); card.querySelector('.pacts').innerHTML = `<span class="pres">${label}</span>`; }
  async function answer(card, body, label, cls) {
    closeCard(card, label, cls);
    try { await post('/api/permission', { request_id: card.dataset.id, ...body }); } catch (e) { addSys('could not send answer: ' + e.message, true); }
    setAvatar('thinking');
  }
  function askCard(ev) {
    const r = ev.request, input = r.input || {}, card = document.createElement('div'); card.className = 'perm'; card.dataset.id = ev.request_id;
    setAvatar('ask');
    const rules = (r.permission_suggestions || []).filter(x => x.type === 'addRules').flatMap(x => x.rules.map(q => q.toolName + (q.ruleContent ? '(' + q.ruleContent + ')' : '')));
    if (r.tool_name === 'AskUserQuestion' && Array.isArray(input.questions)) {
      card.innerHTML = `<div class="phead"><span class="tag">QUESTION</span></div>` + input.questions.map((q, i) => `<div class="pq"><div class="ptxt">${esc(q.question)}</div><div class="pacts" data-q="${i}">${(q.options || []).map((o, j) => `<button class="btn" data-o="${j}" title="${esc(o.description || '')}">${esc(o.label)}</button>`).join('')}</div></div>`).join('');
      const ans = {};
      card.addEventListener('click', e => {
        const b = e.target.closest('[data-o]'); if (!b) return; const box = b.parentElement, q = input.questions[+box.dataset.q];
        ans[q.question] = q.options[+b.dataset.o].label; box.innerHTML = `<span class="pres">${esc(ans[q.question])}</span>`;
        if (Object.keys(ans).length === input.questions.length) { card.classList.add('done'); post('/api/permission', { request_id: ev.request_id, behavior: 'allow', updatedInput: { ...input, answers: ans } }).catch(e2 => addSys(e2.message, true)); setAvatar('thinking'); }
      });
    } else {
      const tp = toolParts(r.tool_name, input);
      card.innerHTML = `<div class="phead"><span class="tag">ALLOW?</span><span class="tag alt">${esc(r.display_name || r.tool_name).toUpperCase()}</span><span class="arg">${esc(r.description || tp.arg)}</span></div>
        <div class="pbody">${tp.body || ''}</div>${r.blocked_path ? `<div class="pnote">${esc(r.blocked_path)}</div>` : ''}
        <div class="pacts"><button class="btn go" data-a="allow">ALLOW</button>${rules.length ? `<button class="btn" data-a="always" title="${esc(rules.join(', '))}">ALWAYS</button>` : ''}<button class="btn danger" data-a="deny">DENY</button></div>
        ${rules.length ? `<div class="pnote">ALWAYS adds ${esc(rules.join(', '))} to this project's local settings</div>` : ''}`;
      card.addEventListener('click', e => {
        const b = e.target.closest('[data-a]'); if (!b) return;
        if (b.dataset.a === 'deny') answer(card, { behavior: 'deny' }, 'DENIED', 'no'); else answer(card, { behavior: 'allow', always: b.dataset.a === 'always' }, b.dataset.a === 'always' ? 'ALWAYS ALLOWED' : 'ALLOWED', 'yes');
      });
    }
    log.appendChild(card); scroll();
  }
  function summarize(c) {
    const i = c.input || {};
    return i.file_path || i.command || i.pattern || i.path || i.url || i.description || JSON.stringify(i).slice(0, 80);
  }
  function addTool(c) {
    const d = document.createElement('details'); d.className = 'tool';
    const tp = toolParts(c.name, c.input);
    d.innerHTML = `<summary><span class="st"></span><span class="tag">${esc(c.name).toUpperCase()}</span><span class="arg">${esc(tp.arg)}</span>${tp.stat}</summary>${tp.body}`;
    if (tp.diff) { d.open = true; d.dataset.diff = '1'; }
    log.appendChild(d); tools[c.id] = d; scroll();
  }
  function finishTool(c) {
    const d = tools[c.tool_use_id]; if (!d) return;
    d.classList.add(c.is_error ? 'err' : 'done'); if (!c.is_error) burst(4);
    const txt = Array.isArray(c.content) ? c.content.map(x => x.text || '').join('\n') : String(c.content || '');
    if (!d.dataset.diff || c.is_error) d.appendChild(resultEl(txt));
    scroll();
  }

  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: state.ctrl.signal,
      body: JSON.stringify({ project: state.project, prompt, sessionId: state.sessionId, model: state.model, mode: state.mode, effort: state.effort, autoName: cfg.autoName !== false, attachments: sending.map(({ name, type, data }) => ({ name, type, data })) }) });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let nl;
      while ((nl = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1); if (line) { try { onEvent(JSON.parse(line)); } catch {} } }
    }
  } catch (e) { if (e.name === 'AbortError') { queue.length = 0; renderQueue(); addSys('stopped', true); setAvatar('idle'); } else { addSys(e.message, true); setAvatar('error'); } }
  endText(); clearInterval(timer); setBusy(false); $('#input').focus(); loadSessions(); setTimeout(loadSessions, 5000); setTimeout(loadSessions, 12000);
  const nx = queue.shift(); renderQueue();
  if (nx) { const draft = $('#input').value, keep = atts.splice(0); $('#input').value = nx.prompt; atts.push(...nx.atts); send(); $('#input').value = draft; atts.push(...keep); renderTray(); }
}

$('#btnSend').onclick = () => { jiggle($('#btnSend'), 'pop'); if ($('#input').value.trim()) { burst(10); chime('send'); } send(); };
$('#btnStop').onclick = $('#btnStopM').onclick = () => state.ctrl && state.ctrl.abort();
const IS_REMOTE = !['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname);
if (IS_REMOTE) document.body.classList.add('remote');
const drawer = side => { document.body.classList.toggle('d-left', side === 'left'); document.body.classList.toggle('d-right', side === 'right'); };
$('#btnProj').onclick = () => drawer('left'); $('#btnCtl').onclick = () => drawer('right');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => drawer(''));
document.querySelector('.left').addEventListener('click', e => { if (e.target.closest('.pad,.sess') && !e.target.closest('.x')) setTimeout(() => drawer(''), 150); });
document.querySelector('.right').addEventListener('click', e => { if (e.target.closest('#btnNew')) setTimeout(() => drawer(''), 150); });
$('#btnNew').onclick = () => { if (!state.busy) crtSwap(() => { reset(); loadSessions(); }); };
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
refresh();
bootScreen(localStorage.getItem('cc1.project')).then(() => { if (!calmUI()) { const s = $('#screen'); s.classList.add('crton'); setTimeout(() => s.classList.remove('crton'), 450); } });
</script>
